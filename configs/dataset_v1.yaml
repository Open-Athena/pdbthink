# Two-state pairs: experimentally observed matched structures of one protein.
state_pairs:
  - id: adenylate_kinase
    cluster: adenylate_kinase
    notes: open (4AKE) versus closed (1AKE) E. coli adenylate kinase
    state1: { id: ak_open, source_type: pdb, entry: 4AKE, chains: [A] }
    state2: { id: ak_closed, source_type: pdb, entry: 1AKE, chains: [A] }
  - id: glutamine_binding_protein
    notes: open (1GGG) versus closed (1WDN) glutamine-binding protein
    state1: { id: glnbp_open, source_type: pdb, entry: 1GGG, chains: [A] }
    state2: { id: glnbp_closed, source_type: pdb, entry: 1WDN, chains: [A] }
  - id: hras
    cluster: hras
    notes: GDP (4Q21) versus GppNHp (5P21) H-Ras
    state1: { id: hras_gdp, source_type: pdb, entry: 4Q21, chains: [A] }
    state2: { id: hras_gtp, source_type: pdb, entry: 5P21, chains: [A] }
  - id: dhfr
    cluster: dhfr
    notes: two ligand states of E. coli dihydrofolate reductase
    state1: { id: dhfr_1, source_type: pdb, entry: 1RX1, chains: [A] }
    state2: { id: dhfr_2, source_type: pdb, entry: 1RX2, chains: [A] }
  - id: haemoglobin_alpha
    notes: deoxy T state (2HHB) versus oxy R state (1HHO), alpha subunit
    state1: { id: hb_t, source_type: pdb, entry: 2HHB, chains: [A] }
    state2: { id: hb_r, source_type: pdb, entry: 1HHO, chains: [A] }
  - id: ribose_binding_protein
    cluster: ribose_binding_protein
    notes: open (1URP) versus closed (2DRI) ribose-binding protein
    state1: { id: rbp_open, source_type: pdb, entry: 1URP, chains: [A] }
    state2: { id: rbp_closed, source_type: pdb, entry: 2DRI, chains: [A] }
  - id: calmodulin_states
    cluster: calmodulin
    notes: two calcium-loaded calmodulin conformations
    state1: { id: cam_extended, source_type: pdb, entry: 1CLL, chains: [A] }
    state2: { id: cam_compact, source_type: pdb, entry: 1PRW, chains: [A] }

