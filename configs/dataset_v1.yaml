# V1 dataset configuration for the Protein Structural Reasoning Benchmark.
#
# Rebuilding with this file, `configs/definitions_v1.yaml` and the cached source
# structures reproduces byte-identical prompts and gold labels.

name: pdbthink_v1
version: "1.0.0"
# Bumped from 20260812 on 2026-08-13. The previous answer set was committed in
# plaintext before the repository withheld gold answers, so it is exposed in git
# history; regenerating under a new seed replaces it with a different, equally
# admissible set rather than rewriting published history.
# See docs/contamination.md.
seed: 20260813001

token_budget:
  automatic: 64000
  mechanistic: 96000
  tokenizer: cl100k_base

# Section 6: ~20% of semantic instances get a second proper random rotation, and
# a matched subset is additionally rendered as normalized coordinates.
rotation_variant_fraction: 0.20
representation_variant_fraction: 0.35

# Section 8: no protein may contribute more than six automatic instances.
max_instances_per_protein: 6

# Section 8 allocates 91 automatic instances. Targets are raised above that
# here so the candidate set exceeds 100 and a curator can prune to the
# 90-110 accepted range while rejecting freely.
family_targets:
  P01: 7
  P02: 5
  P03: 5
  G01: 6
  G02: 6
  G03: 6
  G04: 5
  S01: 6
  S02: 4
  S03: 6
  S04: 6
  S05: 6
  S06: 8
  S07: 7
  S08: 6
  S09: 6
  I01: 7
  N01: 6
  T01: 6

