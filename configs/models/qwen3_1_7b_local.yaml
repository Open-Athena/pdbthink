# Qwen3-1.7B served locally by ollama.
#
#   OLLAMA_CONTEXT_LENGTH=40960 OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve
#   ollama pull qwen3:1.7b
#   structural-reasoning evaluate --dataset datasets/smoke \
#       --model-config configs/models/qwen3_1_7b_local.yaml \
#       --output runs/qwen3-1.7b --max-input-tokens 36000
#
# Uses ollama's native endpoint rather than its OpenAI-compatible one: the shim
# drops `think`, and with reasoning left on this model spends all 3,072 output
# tokens on a trace and returns nothing to score.
#
# Qwen3-1.7B's window is 40,960 tokens, well below the longest prompts here, so
# `--max-input-tokens` is required; the skipped renders are recorded in the run
# configuration so the lost coverage stays visible.
model_id: qwen3:1.7b
provider: ollama_chat
base_url: http://localhost:11434
api_key_env: OLLAMA_API_KEY
max_output_tokens: 2048
temperature: 0.0
completions: 1
concurrency: 2
request_timeout: 900
label: qwen3-1.7b
extra_body:
  think: false
