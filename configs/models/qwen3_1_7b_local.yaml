# Qwen3-1.7B served locally by ollama.
#
#   OLLAMA_CONTEXT_LENGTH=40960 OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve
#   ollama pull qwen3:1.7b
#   structural-reasoning evaluate --dataset datasets/smoke \
#       --model-config configs/models/qwen3_1_7b_local.yaml \
#       --output runs/qwen3-1.7b --max-input-tokens 36000
#
# Qwen3-1.7B has a 40,960-token window, which is smaller than many of this
# benchmark's prompts, so `--max-input-tokens` is required and the skipped
# renders are recorded in the run configuration. Thinking cannot be switched off
# through ollama's OpenAI-compatible endpoint, so the output budget has to be
# large enough for the reasoning trace plus the FINAL line; ollama returns the
# trace in a separate `reasoning` field, so only the answer reaches the scorer.
model_id: qwen3:1.7b
provider: openai_chat
base_url: http://localhost:11434/v1
api_key_env: OLLAMA_API_KEY
max_output_tokens: 3072
temperature: 0.0
completions: 1
concurrency: 2
request_timeout: 900
label: qwen3-1.7b
