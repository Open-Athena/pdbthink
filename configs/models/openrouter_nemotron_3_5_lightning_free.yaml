# NVIDIA Nemotron 3.5 Lightning's free OpenRouter endpoint, intended for
# plumbing checks and cheap iteration rather than a final benchmark result.
# Free endpoint availability and rate limits can vary over time.
#
# Export OPENROUTER_API_KEY in the current shell before running:
#
#   structural-reasoning evaluate --dataset datasets/smoke \
#       --model-config configs/models/openrouter_nemotron_3_5_lightning_free.yaml \
#       --output runs/nemotron-3.5-lightning-free --limit 1 --resume
model_id: nvidia/nemotron-3.5-lightning:free
provider: openai_chat
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
max_output_tokens: 8192
temperature: 0.0
completions: 1
concurrency: 1
request_timeout: 900
max_retries: 2
label: nemotron-3.5-lightning-free
