# MiniMax M3 on Together.ai. A fourth independent lineage with a 524,288-token
# window, so no prompt is near its limit.
# The timeout is scaled to the output budget rather than left at a default. At
# 32,768 tokens and the concurrency below, a 900-second limit cuts responses off
# mid-write -- and the runner records that as a network error rather than
# truncation, so the render silently leaves the run. Ninety-seven of Gemma's 253
# renders were lost that way before this was raised.
model_id: MiniMaxAI/MiniMax-M3
provider: openai_chat
base_url: https://api.together.ai/v1
api_key_env: TOGETHER_API_KEY
max_output_tokens: 32768
temperature: 0.0
completions: 1
concurrency: 24
request_timeout: 1800
max_retries: 1
label: minimax_m3
