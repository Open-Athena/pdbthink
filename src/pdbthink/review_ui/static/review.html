<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pdbthink curator review</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Curator review</h1>
  <div class="filters">
    <label>Family <select id="filter-family"><option value="">all</option></select></label>
    <label>Protein <select id="filter-protein"><option value="">all</option></select></label>
    <label>Source <select id="filter-source"><option value="">all</option><option>pdb</option><option>afdb</option></select></label>
    <label>Status <select id="filter-status">
      <option value="">all</option><option value="pending">pending</option>
      <option value="accept">accepted</option><option value="reject">rejected</option>
    </select></label>
    <label>Curator <input id="curator" placeholder="your name"></label>
    <span id="progress" class="progress"></span>
  </div>
</header>

<main>
  <nav id="list" aria-label="instances"></nav>

  <section id="detail">
    <p class="placeholder">Select an instance from the list.</p>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
